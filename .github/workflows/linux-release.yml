name: Linux release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential ffmpeg libvulkan-dev glslc spirv-headers glslang-tools libgtk-3-0 libnss3 libasound2t64 libgbm1 xvfb pulseaudio pulseaudio-utils
      - run: npm ci
      - run: bash scripts/setup-linux.sh
      - run: npm run build && npm run lint && node --test tests/*.test.cjs tests/*.test.mjs
      - name: Check desktop on Linux
        run: xvfb-run -a npm run test:desktop
      - name: Check live capture with a virtual output monitor
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ava_release_test
          pactl set-default-sink ava_release_test
          xvfb-run -a npm run test:live
      - name: Package AppImage and Debian installer
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Verify packaged app
        run: AVA_TEST_AUDIO="$PWD/tests/fixtures/persian-fleurs.wav" AVA_TEST_EXE="$PWD/release/linux-unpacked/ava-persian-transcriber" xvfb-run -a npm run test:desktop
      - name: Publish Linux downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          cd release
          sha256sum *.AppImage *.deb > Linux-SHA256SUMS.txt
          gh release upload "$version" *.AppImage *.deb Linux-SHA256SUMS.txt
